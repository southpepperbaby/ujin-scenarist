# Запуск: python scripts/make_env.py && docker compose up -d --build  →  http://localhost
services:
  backend:
    build: ./backend
    env_file: .env
    volumes:
      - data:/data
      - ./secrets:/run/secrets:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  data:
